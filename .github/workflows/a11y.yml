name: Accessibility
on:
  pull_request:
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pull-requests: write

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ngbracket/a11y-devtools-action@v1
        with:
          serve: npx ng serve
          routes: |
            /
          fail-on: none # report only while you explore
